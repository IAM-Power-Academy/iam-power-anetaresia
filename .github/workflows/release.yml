name: Publiko versionin

# Ndërton ZIP-in e plugin-it dhe e bashkëngjit te versioni (Release),
# sa herë që publikohet një Release i ri në GitHub (p.sh. v1.2.0),
# ose kur shtyhet një etiketë v*.
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollo që versioni përputhet me etiketën
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 -E '^\s*\*\s*Version:' iam-power-anetaresia.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          echo "Etiketa: $TAG  Plugin: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Versioni në iam-power-anetaresia.php ($VER) nuk përputhet me etiketën ($TAG)"
            exit 1
          fi

      - name: Kontrollo sintaksën PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Ndërto ZIP-in
        run: |
          mkdir -p build/iam-power-anetaresia
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude '.gitignore' ./ build/iam-power-anetaresia/
          cd build && zip -rq ../iam-power-anetaresia.zip iam-power-anetaresia

      - name: Bashkëngjit ZIP-in te Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" iam-power-anetaresia.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" iam-power-anetaresia.zip \
              --title "IAM Power Anëtarësia $GITHUB_REF_NAME" \
              --notes "Version i ri i plugin-it."
          fi
