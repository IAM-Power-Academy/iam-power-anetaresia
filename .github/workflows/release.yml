name: Publiko versionin

# Sa herë që ndryshon numri i versionit te iam-power-anetaresia.php në main,
# krijohet vetë etiketa (v1.x.x), ZIP-i dhe versioni (Release).
# WordPress-i në iampower.al e gjen dhe përditësohet vetë — pa asnjë klikim.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lexo versionin
        id: v
        run: |
          VER=$(grep -m1 -E '^\s*\*\s*Version:' iam-power-anetaresia.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "IAMP_VERSION'" iam-power-anetaresia.php | sed -E "s/.*'IAMP_VERSION',\s*'([^']+)'.*/\1/")
          echo "Versioni: $VER (IAMP_VERSION: $CONST)"
          if [ "$VER" != "$CONST" ]; then
            echo "::error::Version ($VER) dhe IAMP_VERSION ($CONST) nuk përputhen"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "Versioni v$VER është publikuar më parë — s'ka gjë për të bërë."
            echo "new=0" >> "$GITHUB_OUTPUT"
          else
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Kontrollo sintaksën PHP
        if: steps.v.outputs.new == '1'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Ndërto ZIP-in
        if: steps.v.outputs.new == '1'
        run: |
          mkdir -p build/iam-power-anetaresia
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude '.gitignore' --exclude 'google-apps-script' ./ build/iam-power-anetaresia/
          cd build && zip -rq ../iam-power-anetaresia.zip iam-power-anetaresia

      - name: Publiko versionin
        if: steps.v.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          NOTES=$(git log -1 --pretty=%s)
          gh release create "v$VER" iam-power-anetaresia.zip \
            --target "$GITHUB_SHA" \
            --title "IAM Power Anëtarësia v$VER" \
            --notes "$NOTES" \
            --latest
